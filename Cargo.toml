[workspace]
resolver = "2"
members = ["pack-icd10", "icd10-khive"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[workspace.dependencies]
khive-types = { git = "https://github.com/ohdearquant/khive", rev = "5ccfedad5c084b8026e6605a07aa280c7c8450cd", features = ["serde"] }
khive-storage = { git = "https://github.com/ohdearquant/khive", rev = "5ccfedad5c084b8026e6605a07aa280c7c8450cd" }
khive-runtime = { git = "https://github.com/ohdearquant/khive", rev = "5ccfedad5c084b8026e6605a07aa280c7c8450cd" }
khive-score = { git = "https://github.com/ohdearquant/khive", rev = "5ccfedad5c084b8026e6605a07aa280c7c8450cd" }
khive-fusion = { git = "https://github.com/ohdearquant/khive", rev = "5ccfedad5c084b8026e6605a07aa280c7c8450cd" }
khive-vamana = { git = "https://github.com/ohdearquant/khive", rev = "5ccfedad5c084b8026e6605a07aa280c7c8450cd" }
kkernel = { git = "https://github.com/ohdearquant/khive", rev = "5ccfedad5c084b8026e6605a07aa280c7c8450cd" }

inventory = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
async-trait = "0.1"
regex = "1.10"
quick-xml = "0.41"
anyhow = "1.0"
